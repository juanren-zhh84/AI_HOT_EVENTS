name: Deploy AI Hot Events

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.SERVER_PORT }}" "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync files to server
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SERVER_PORT }}" \
            --exclude ".git" \
            --exclude ".github" \
            --exclude ".env" \
            --exclude ".env.production" \
            --exclude "__pycache__" \
            --exclude ".pytest_cache" \
            --exclude ".venv" \
            ./ ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/opt/ai-hot-events/

      - name: Install dependencies and restart service
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.SERVER_PORT }}" \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
          set -e
          cd /opt/ai-hot-events
          source ~/miniconda3/etc/profile.d/conda.sh
          conda activate aihotevent
          pip install -r requirements.txt
          sudo -n systemctl restart ai-hot-events
          sudo -n systemctl status ai-hot-events --no-pager -l
          curl -f http://127.0.0.1:8000/api/v1/health
          EOF

      - name: Show recent backend logs
        if: always()
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.SERVER_PORT }}" \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "sudo -n journalctl -u ai-hot-events -n 80 --no-pager"